name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: decrypt_backup
            asset_name: decrypt_backup-linux-amd64
          - os: windows-latest
            artifact_name: decrypt_backup.exe
            asset_name: decrypt_backup-windows-amd64.exe
          - os: macos-latest
            artifact_name: decrypt_backup
            asset_name: decrypt_backup-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name decrypt_backup decrypt_backup.py

      - name: Upload executable to release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
